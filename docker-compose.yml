services:
  db:
    image: postgres:16-alpine
    container_name: servicecontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicecontrol
      POSTGRES_PASSWORD: servicecontrol
      POSTGRES_DB: servicecontrol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicecontrol -d servicecontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    container_name: servicecontrol-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: servicecontrol
      DB_PASSWORD: servicecontrol
      DB_DATABASE: servicecontrol
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: servicecontrol-dev-secret
      JWT_EXPIRES_IN: 8h
      SEED_COMPANY_CNPJ: 11222333000181
      SEED_COMPANY_NAME: Empresa Seed
      SEED_ADMIN_EMAIL: admin@servicecontrol.com.br
      SEED_ADMIN_PASSWORD: admin123
      SEED_ADMIN_NAME: Administrador
    ports:
      - "1511:3000"

volumes:
  pgdata: